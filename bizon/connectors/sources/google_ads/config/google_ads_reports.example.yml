name: google ads campaign daily to logger

source:
  name: google_ads
  stream: campaign_daily
  sync_mode: incremental
  client_id: <YOUR_OAUTH_CLIENT_ID>
  client_secret: <YOUR_OAUTH_CLIENT_SECRET>
  refresh_token: <YOUR_REFRESH_TOKEN>
  login_customer_id: "<YOUR_MANAGER_CUSTOMER_ID>"
  # Empty = every enabled non-manager account under login_customer_id.
  customer_ids: []
  start_date: "2024-01-01"
  # Each incremental run re-reads this many days so conversion restatements land.
  lookback_days: 30
  window_days: 31

destination:
  name: logger
  config:
    dummy: dummy
