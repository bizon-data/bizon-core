name: twilio messages incremental to logger

source:
  name: twilio
  stream: messages
  sync_mode: incremental
  cursor_field: date_sent
  account_sid: <YOUR_MASTER_ACCOUNT_SID>
  auth_token: <YOUR_AUTH_TOKEN>
  # Without starting_date the first run reads the last 90 days.
  starting_date: "2024-01-01"
  page_size: 1000
  lag_days: 1
  include_message_body: false
  # Optional: only iterate these subaccounts.
  # subaccount_sids:
  #   - <SUBACCOUNT_SID>

destination:
  name: logger
  config:
    dummy: dummy
