name: stripe charges incremental to logger

# Incremental charges runs two phases: newly created charges, then charges touched by recent events
# (refunds, disputes) so updates to older charges are picked up too.
source:
  name: stripe
  stream: charges
  sync_mode: incremental
  api_key: <YOUR_API_KEY>
  start_date: "2024-01-01T00:00:00Z"
  lookback_days: 2

destination:
  name: logger
  config:
    dummy: dummy
