name: hubspot contacts to bigquery

source:
  name: hubspot
  stream: contacts
  properties:
    strategy: all
  authentication:
    type: api_key
    api_key: <MY_API_KEY>

destination:
  # Authentication: If empty it will be infered.
  # Must have the bigquery.jobUser
  # Must have the bigquery.dataEditor and storage.objectUser on the supplied dataset and bucket
  name: bigquery
  config:
    buffer_size: 10 # in Mb
    buffer_flush_timeout: 300 # in seconds
    dataset_id: bizon_test
    dataset_location: US
    create_dataset: false # create the dataset if it doesn't exist (default false)
    project_id: my-gcp-project-id
    gcs_buffer_bucket: bizon-buffer
    gcs_buffer_format: parquet
    # Async batched load jobs (optional, default false). When enabled, buffer flushes upload
    # to GCS and submit load jobs without blocking, batching several files into one load job to
    # cut the per-table load-job quota (1,500/table/day). Cursors are only committed once a load
    # lands, so the at-least-once recovery contract is preserved.
    async_load: false
    load_files_per_job: 10 # GCS files batched into a single load job (when async_load is true)
    load_max_in_flight_jobs: 3 # max concurrent in-flight load jobs before back-pressuring
    service_account_key: >-
      {
        "type": "service_account",
        "project_id": "my-gcp-project-id",
        "private_key_id": "",
        "private_key": "-----BEGIN PRIVATE KEY-----\n\n-----END PRIVATE KEY-----\n",
        "client_email": "a-bizon-service-account@my-gcp-project-id.iam.gserviceaccount.com",
        "client_id": "",
        "auth_uri": "https://accounts.google.com/o/oauth2/auth",
        "token_uri": "https://oauth2.googleapis.com/token",
        "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
        "client_x509_cert_url": "",
        "universe_domain": "googleapis.com"
      }
