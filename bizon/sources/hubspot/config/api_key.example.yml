source:
  source_name: hubspot
  stream_name: contacts
  properties:
    strategy: all
  authentication:
    type: api_key
    params:
      token: <MY_API_KEY>

backend:
  type: bigquery
  database: <MY_GCP_PROJECT>
  schema: bizon_test
  syncCursorInDBEvery: 2

destination:
  name: bigquery

pipeline:
  log_level: DEBUG