source:
  source_name: hubspot
  stream_name: contacts
  properties:
    strategy: all
  authentication:
    type: oauth
    oauth:
      client_id: <MY_CLIENT_ID>
      client_secret: <MY_CLIENT_SECRET>
      refresh_token: <MY_REFRESH_TOKEN>

backend:
  type: bigquery
  database: <MY_GCP_PROJECT>
  schema: bizon_test
  syncCursorInDBEvery: 2

destination:
  name: bigquery

pipeline:
  log_level: DEBUG