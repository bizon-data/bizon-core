name: Quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.12"
      - run: uv sync --locked --only-group dev
      - run: uv run --locked --only-group dev ruff check .
      - run: uv run --locked --only-group dev ruff format --check .
      - name: Verify package builds
        run: uv build --no-sources

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  audit:
    name: Audit (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: ${{ matrix.python-version }}
      - name: Export locked dependencies supported by this Python version
        env:
          AUDIT_PYTHON: ${{ matrix.python-version }}
        run: |
          groups=(--all-groups)
          if [[ "$AUDIT_PYTHON" == "3.10" ]]; then
            groups=(--no-dev --group test)
          fi
          uv export --locked --all-extras "${groups[@]}" --no-emit-project --output-file requirements-audit.txt
      - name: Audit resolved versions without installing application dependencies
        run: uvx --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps --requirement requirements-audit.txt
