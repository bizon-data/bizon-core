name: Pytest bizon

on:
  pull_request:
  # Releases are tagged on main, so main itself must be green, not only the PRs that reached it.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    container: python:${{ matrix.python-version }}

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bizon
          POSTGRES_DB: bizon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bizon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.13.8"

    - name: Install dependencies
      run: |
        uv sync --locked --no-dev --all-extras --group test

    - name: Run tests
      run: |
        uv run --locked --no-dev pytest tests/ --ignore=tests/e2e/ -m "not live"
      env:
        POSTGRES_HOST: postgres
        POSTGRES_PORT: 5432
        # Makes any Google client that escapes its mock fail instead of looking for credentials.
        GOOGLE_APPLICATION_CREDENTIALS: /nonexistent/credentials.json
