name: Pytest bizon

on:
  pull_request:
    paths:
      - 'bizon/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pytest.yml'
  # Releases are tagged on main, so main itself must be green, not only the PRs that reached it.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    container: python:${{ matrix.python-version }}

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bizon
          POSTGRES_DB: bizon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bizon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: Install dependencies
      run: |
        uv sync --all-extras --group test

    - name: Run tests
      run: |
        uv run pytest tests/ --ignore=tests/e2e/ -m "not live"
      env:
        POSTGRES_HOST: postgres
        POSTGRES_PORT: 5432
        # Makes any Google client that escapes its mock fail instead of looking for credentials.
        GOOGLE_APPLICATION_CREDENTIALS: /nonexistent/credentials.json
