[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bizon"
version = "0.7.1"
description = "Extract and load your data reliably from API Clients with native fault-tolerant and checkpointing mechanism."
authors = [
    { name = "Antoine Balliet", email = "antoine.balliet@gmail.com" },
    { name = "Anas El Mhamdi", email = "anas.elmhamdi@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "requests>=2.33.0",
    "certifi>=2026.10.19",
    "pyyaml>=6.0.1",
    "pydantic>=2.8.2",
    "backoff>=2.2.1",
    "pendulum>=3.0.0",
    "dpath>=2.2.0",
    "pydantic-extra-types>=2.9.0",
    "loguru>=0.7.2",
    "pyarrow>=23.0.1",
    "google-cloud-storage>=2.17.0",
    "sqlalchemy>=2.0.32",
    "polars>=1.16.0",
    "click>=8.1.7",
    "pytz>=2024.2",
    "tenacity>=9.0.0",
    "orjson>=3.11.6",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.9"]
bigquery = [
    "google-cloud-bigquery-storage>=2.25.0",
    "google-cloud-bigquery>=3.25.0",
    "sqlalchemy-bigquery>=1.11.0",
    "protobuf>=6.33.5",
]
kafka = [
    "confluent-kafka>=2.6.0",
    "fastavro>=1.9.7",
    "avro>=1.12.0",
    "kafka-python>=2.3.2",
]
rabbitmq = ["pika>=1.3.2"]
gsheets = ["gspread>=6.1.2"]
datadog = ["datadog>=0.50.2", "ddtrace>=4.15.6"]
secretmanager = ["google-cloud-secret-manager>=2.20.0"]
github = ["PyJWT>=2.8.0", "cryptography>=50.0.0"]
# PyMuPDF is AGPL-3.0, so it stays behind an opt-in extra; 2.x drags in onnxruntime for layout analysis.
spotdraft = ["pymupdf>=1.26.7,<2"]

[project.scripts]
bizon = "bizon.cli.main:cli"

[dependency-groups]
test = [
    "pytest>=9.0.3",
    "requests-mock>=1.10.0",
    "python-dotenv>=1.2.2",
    "pytest-lazy-fixtures>=1.4.1",
    "faker>=26.0.0",
]
dev = [
    "ipykernel>=6.29.5",
    "snakeviz>=2.1.2",
    "yappi>=1.3.2",
    "pre-commit>=3.8.0",
    "ruff==0.17.5",
]

# Patched notebook/profiler and pre-commit dependencies require Python 3.11.
# Runtime and the test group continue to support Python 3.10.
[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11" }

[tool.hatch.build.targets.wheel]
packages = ["bizon"]

[tool.ruff]
line-length = 120
target-version = "py310"
include = ["*.py", "*.pyi", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E711",   # comparison to None (existing code)
    "E712",   # comparison to True/False (common in tests)
    "E721",   # type comparison using == (existing code)
    "F841",   # unused variable (common in tests with pytest.raises)
    "B006",   # mutable default arguments
    "B007",   # unused loop variable
    "B008",   # function calls in argument defaults
    "B015",   # pointless comparison (existing code)
    "B019",   # lru_cache on methods
    "B023",   # function binding loop variable
    "B026",   # star-arg unpacking after keyword
    "B027",   # empty method in abstract class
    "B904",   # raise from in except (existing code)
    "C4",     # flake8-comprehensions (existing code style)
    "UP006",  # deprecated typing (List -> list) - existing code
    "UP035",  # deprecated typing imports - existing code
    "UP007",  # keep existing Union annotations during dependency maintenance
    "UP045",  # keep existing Optional annotations during dependency maintenance
]

[tool.ruff.lint.isort]
known-first-party = ["bizon"]
